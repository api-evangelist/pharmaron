name: Pharmaron
description: 'Pharmaron is a life-science contract research, development, and manufacturing
  organization (CRO/CDMO) providing R&D services across the full drug-discovery and
  development pipeline for the pharmaceutical and biotechnology industry. Its services
  span laboratory research, chemistry, biology, drug metabolism and pharmacokinetics,
  safety assessment, chemistry-manufacturing-and-controls (CMC), and clinical
  development for small molecules, biologics, and cell and gene therapies. Pharmaron
  operates globally with facilities in China, the US, and the UK and is publicly
  listed. It is a B2B partner to drug developers and does not currently publish a
  public developer portal or API.'
